<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiraBulous | Handmade Crafts & Design</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #2B2B2B; /* Her exact dark grey/black typography tone */
            --accent-pink: #F06292; /* Her signature sakura pink */
            --font-display: 'Georgia', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .wrapper {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* Temporary CSS Sakura Bloom Symbol */
        .bloom-icon {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto 2rem auto;
            opacity: 0.85;
        }

        .bloom-icon::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--accent-pink);
            border-radius: 50%;
            box-shadow: 
                -20px -10px 0 -5px var(--accent-pink),
                20px -10px 0 -5px var(--accent-pink),
                -15px 20px 0 -5px var(--accent-pink),
                15px 20px 0 -5px var(--accent-pink);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        /* Replicating her casing style */
        h1 span {
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        .status-box {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 2rem 0;
            margin-bottom: 3rem;
        }

        .status-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a4a4a;
        }

        .contact-link {
            display: inline-block;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--accent-pink);
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .contact-link:hover {
            color: var(--accent-pink);
            border-bottom-color: var(--text-main);
        }

        footer {
            margin-top: 5rem;
            font-size: 0.8rem;
            color: #999;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <div class="bloom-icon"></div>

        <h1>Mira<span>B</span>ulous</h1>
        <p class="subtitle">Handmade Crafts by Miranda Evangelou</p>

        <div class="status-box">
            <p>Our digital workshop is currently being re-architected. We are composing native, scalable vector elements and layout infrastructure to showcase her latest custom collections.</p>
        </div>

        <a href="mailto:miranda@mirabulous.com" class="contact-link">Get in Touch</a>

        <footer>
            <p>&copy; 2026 MIRABULOUS. ALL RIGHTS RESERVED.</p>
        </footer>

    </div>

</body>
</html>
